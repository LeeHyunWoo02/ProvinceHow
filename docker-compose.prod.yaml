# 운영 환경용 docker-compose (Oracle Cloud Infrastructure 컴퓨트 인스턴스)
#
#   docker compose -f docker-compose.prod.yaml up -d --build
#   docker compose -f docker-compose.prod.yaml logs -f backend
#
# dev(docker-compose.yaml)와의 차이
#   - Dockerfile(prod, SPRING_PROFILES_ACTIVE=prod) 사용
#   - mysql / redis 포트를 호스트에 노출하지 않는다 (컨테이너 네트워크 내부에서만 접근)
#   - restart: unless-stopped
#   - redis 영속화(appendonly) — 재시작 시 지원정책 캐시가 비지 않도록
#
# OCI 참고
#   - Ampere A1(Always Free)은 arm64다. 아래 이미지는 모두 multi-arch(arm64 지원)이므로
#     인스턴스에서 직접 빌드하면 그대로 동작한다. 다른 머신에서 빌드해 올린다면
#     플랫폼을 맞춰야 한다: docker buildx build --platform linux/arm64
#   - 인스턴스 방화벽(iptables)과 VCN 보안 목록 양쪽에서 포트를 열어야 외부 접속이 된다.
#     OCI 이미지는 기본적으로 iptables가 막고 있다.
name: smash-prod

services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    restart: unless-stopped
    # nginx 리버스 프록시를 앞에 둔다면 ports 대신 expose 로 바꾼다.
    ports:
      - '8080:8080'
    env_file:
      - ./backend.env
    volumes:
      - ./data:/app/data:ro
    depends_on:
      mysql:
        condition: service_healthy
      my-redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    env_file:
      - ./backend.env
    # ports 를 열지 않는다. 외부에서 DB에 직접 붙지 못하게 한다.
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # 서비스명은 dev와 동일하게 유지한다 (REDIS_HOST 값을 양쪽에서 같게 쓰기 위함)
  my-redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

volumes:
  mysql-data:
  redis-data:
