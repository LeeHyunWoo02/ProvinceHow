name: ci-cd-docker

on:
  push:
    branches: ["main"] # PR 머지 후 main으로 push되면 실행

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_REPO }}
  USE_FLOATING_LATEST: "false"
  PLATFORMS: "linux/arm64"                 # ← 기본 플랫폼 지정(필요 시 arm64 추가)

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm   # OCI Ampere(무료티어)가 arm64 이므로 네이티브 ARM 러너에서 빌드
    outputs:
      prod_tag: ${{ steps.ver.outputs.prod_tag }}
      sha_tag:  ${{ steps.ver.outputs.sha_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute immutable tags
        id: ver
        shell: bash
        run: |
          DATE=$(date +%Y%m%d)
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          FULL_SHA="${GITHUB_SHA}"
          PROD_TAG="prod-${DATE}-${SHORT_SHA}"
          echo "prod_tag=${PROD_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${FULL_SHA}" >> "$GITHUB_OUTPUT"
          echo "version_for_build=${PROD_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build & Push (immutable tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ env.PLATFORMS }}
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version_for_build }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.prod_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed:"
          echo " - ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.prod_tag }}"
          echo " - ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.sha_tag }}"
          if [ "${{ env.USE_FLOATING_LATEST }}" = "true" ]; then
            echo " - ${{ env.IMAGE_NAME }}:prod-latest (floating, do NOT use for deploy)"
          fi

  deploy:
    name: Deploy to OCI
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # backend.env(앱 시크릿)는 서버에 수동으로 미리 둔다(전송하지 않음).
      # 배포 compose + 정적 기준데이터 + mysql init 스크립트만 서버로 보낸다.
      - name: Copy deploy files to OCI
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "docker-compose.deploy.yaml,data/static,docker/mysql/init"
          target: "/home/ubuntu/smash"

      - name: Deploy on OCI
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ secrets.DOCKERHUB_REPO }}:${{ needs.build-and-push.outputs.prod_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: IMAGE,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            cd /home/ubuntu/smash
            if ! command -v docker >/dev/null 2>&1; then
              echo "::error::Docker가 설치돼 있지 않습니다. OCI 서버에 docker/docker compose를 먼저 설치하세요."
              exit 1
            fi
            if [ ! -f backend.env ]; then
              echo "::error::/home/ubuntu/smash/backend.env 가 없습니다. 앱 시크릿이 담긴 backend.env를 서버에 먼저 두세요."
              exit 1
            fi
            mkdir -p data/generated
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            export SMASH_IMAGE="$IMAGE"
            docker compose -f docker-compose.deploy.yaml pull
            docker compose -f docker-compose.deploy.yaml up -d --remove-orphans
            docker image prune -f
            docker logout || true
            echo "배포 완료: $IMAGE"

# 배포 흐름: main push -> build-and-push(이미지 빌드/Docker Hub 푸시) -> deploy(OCI SSH 접속,
# 배포 compose로 이미지 pull & up -d). 서버 사전 준비(수동): docker/docker compose 설치,
# /home/ubuntu/smash/backend.env(앱 시크릿). GitHub Secrets: OCI_HOST/OCI_USERNAME/OCI_SSH_KEY, DOCKERHUB_*.
