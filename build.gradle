plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'SDD'
version = '0.0.1-SNAPSHOT'
description = '소프트웨어 개발보안 시큐어코딩 '

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
	implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    implementation 'software.amazon.jdbc:aws-advanced-jdbc-wrapper:2.5.0'
    compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.springframework.batch:spring-batch-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// 버전을 지정하지 않는다. Spring Boot 3.5.7 이 Testcontainers 1.21.3 을 관리한다.
	testImplementation 'org.testcontainers:mysql'
	testImplementation 'org.testcontainers:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()

	// Testcontainers 1.21.3 이 쓰는 docker-java 는 Docker API 1.32 로 붙는데,
	// Docker Engine 29 는 최소 1.40 을 요구해 /info 가 400 을 돌려준다.
	// docker-java 는 이 값을 'api.version' 시스템 프로퍼티(또는 API_VERSION 환경변수)에서 읽는다.
	systemProperty 'api.version', (System.getenv('API_VERSION') ?: '1.40')
}
