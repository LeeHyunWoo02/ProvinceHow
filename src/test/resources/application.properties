# Test-only configuration.
#
# Unlike dev/prod this uses no profile. With no active profile @SpringBootTest reads only
# application.properties, so every placeholder the application requires is filled here.
# Only DataSource connection details come from IntegrationTestSupport @DynamicPropertySource.

spring.application.name=smash

# Batch Config
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.batch.jdbc.schema=classpath:org/springframework/batch/core/schema-mysql.sql

front_url=http://localhost:5173

# DataSource - jdbc-url / username / password are supplied by Testcontainers
spring.datasource-meta.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource-data.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false

server.port=0

# Redis - no connection at context load time (Lettuce connects lazily).
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.ssl.enabled=false
spring.data.redis.repositories.enabled=false

# Swagger Configuration
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.paths-to-match=/api/**

# publicData Configuration - never called for real in tests
apis.molit.base-url=http://localhost
apis.molit.paths.apartment=/molit-test/apt
apis.molit.paths.multiplex-house=/molit-test/rh
apis.molit.paths.detached-house=/molit-test/sh
apis.molit.service-key=test-service-key
apis.molit.daily-call-budget=9000
# no retry / no backoff in tests - MOLIT is never called for real here
apis.molit.retry-max-attempts=1
apis.molit.retry-backoff-ms=0

# YouthCenter Configuration
apis.youthcenter.base-url=http://localhost
apis.youthcenter.path=/youth-test
apis.youthcenter.api-key=test-api-key
# Tests never make real calls. Interval and retry delay are 0 so context loading stays fast.
apis.youthcenter.request-interval-ms=0
apis.youthcenter.request-timeout-ms=1000
apis.youthcenter.max-attempts=1
apis.youthcenter.retry-delay-ms=0
apis.youthcenter.retry-backoff-multiplier=2
apis.youthcenter.max-retry-after-ms=0
# Refresh stop conditions. In integration tests the scheduler is a @MockitoBean and never runs.
support.refresh.max-consecutive-failures=5
support.refresh.deadline-minutes=1

seed.version=test

# Base-month override. Must boot even when blank; seedMasterJob resolves it automatically.
dwelling.dealYmd=
dwelling.months=10

# csv file path - not read because seedMasterJob is disabled here
sido.filePath=
sigungu.filePath=
jobCodeTop.filePath=
jobCodeMiddle.filePath=
jobCount.filePath=
regionJobStatistics.filePath=
apis.datagokr.service-key=
industry.filePath=
infra.filePath=
population.filePath=

# The only path that auto-runs on startup. Disabled here; tests launch the Job themselves.
seed.master.enabled=false

# Per-step force-off switches. A step whose source is blank is skipped by the gate anyway.
seed.jobs.sido.enabled=true
seed.jobs.sigungu.enabled=true
seed.jobs.job-code-top.enabled=true
seed.jobs.job-code-middle.enabled=true
seed.jobs.population.enabled=true
seed.jobs.industry.enabled=true
seed.jobs.infra.enabled=true
seed.jobs.job-count.enabled=true
seed.jobs.region-job-statistics.enabled=true
seed.jobs.dwelling.enabled=true
seed.jobs.infra-collect.enabled=false

# Stale execution cleanup (defaults; the recovery test drives the bean directly)
batch.recovery.stale.enabled=true
batch.recovery.stale.threshold=PT15M

# Scheduled refresh jobs - all disabled in tests
population.batch.enabled=false
population.batch.cron=0 10 4 1 * *
localdata.batch.enabled=false
localdata.batch.cron=0 20 3 * * *
worknet.job.batch.enabled=false
worknet.job.batch.cron=0 0 3 * * *
dwelling.batch.enabled=false
dwelling.batch.cron=0 0 6 5 * *

# rate limit
ratelimit.window-seconds=10
ratelimit.allowed-count=30
ratelimit.lock-ttl-ms=60000
ratelimit.secret=test-rate-limit-secret

# openAI - never called for real in tests
openai.api-key=test-openai-key
openai.api-url=http://localhost/openai-test
openai.model=test-model
openai.temperature=0.2

# work24 (worknet job-listing link builder - legacy, inactive unless apis.job.provider=worknet)
worknet.base-url=http://localhost
worknet.path=/worknet-test

# Job-posting provider switch. Default provider (saramin) is active in tests. Never called for real.
apis.job.provider=saramin
apis.saramin.access-key=
apis.saramin.base-url=http://localhost
apis.saramin.path=/saramin-test
apis.saramin.max-attempts=1
apis.saramin.retry-delay-ms=0
apis.saramin.spec-path=classpath:saramin/saramin-job-api.json
apis.saramin.vacancy.list-size=5
apis.saramin.profile.sample-size=100
apis.saramin.profile.top-industries=5
apis.saramin.vacancy.negative-ttl=PT30M
apis.saramin.profile.negative-ttl=PT30M
apis.saramin.cache.lock-timeout=PT3S
apis.saramin.batch.max-api-calls=400
saramin.listing.base-url=http://localhost
saramin.listing.path=/saramin-listing-test

# KOSIS - never called for real in tests (blank key disables the adapter)
apis.kosis.base-url=http://localhost
apis.kosis.api-key=
