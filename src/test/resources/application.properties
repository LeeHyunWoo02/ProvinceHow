# 테스트 전용 설정.
#
# 운영/개발과 달리 프로파일을 쓰지 않는다. @SpringBootTest 는 활성 프로파일이 없으면
# application.properties 만 읽으므로, 애플리케이션이 요구하는 플레이스홀더를 여기서 전부 채운다.
# DataSource 접속 정보만 IntegrationTestSupport 의 @DynamicPropertySource 가 주입한다.

spring.application.name=smash

# Batch Config
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always
spring.batch.jdbc.schema=classpath:org/springframework/batch/core/schema-mysql.sql

front_url=http://localhost:5173

# DataSource - jdbc-url / username / password 는 Testcontainers 가 채운다
spring.datasource-meta.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource-data.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false

server.port=0

# Redis - 컨텍스트 로딩 시점에는 접속하지 않는다(Lettuce 는 지연 접속).
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.ssl.enabled=false
spring.data.redis.repositories.enabled=false

# Swagger Configuration
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.paths-to-match=/api/**

# publicData Configuration - 테스트에서 실제 호출하지 않는다
apis.molit.base-url=http://localhost
apis.molit.path=/molit-test
apis.molit.service-key=test-service-key

# YouthCenter Configuration
apis.youthcenter.base-url=http://localhost
apis.youthcenter.path=/youth-test
apis.youthcenter.api-key=test-api-key

seed.version=test
dwelling.dealYmd=202601

# csv file path - 시드 배치를 전부 끄므로 읽지 않는다
sido.filePath=
sigungu.filePath=
jobCodeTop.filePath=
jobCodeMiddle.filePath=
jobCount.filePath=
industry.filePath=
infra.filePath=
population.filePath=

# 시드 배치 전부 비활성. 켜면 기동 직후 CSV 를 읽고 적재한다.
seed.jobs.sido.enabled=false
seed.jobs.sigungu.enabled=false
seed.jobs.job-code-top.enabled=false
seed.jobs.job-code-middle.enabled=false
seed.jobs.industry.enabled=false
seed.jobs.infra.enabled=false
seed.jobs.population.enabled=false
seed.jobs.job-count.enabled=false

# rate limit
ratelimit.window-seconds=10
ratelimit.allowed-count=30
ratelimit.lock-ttl-ms=60000
ratelimit.secret=test-rate-limit-secret

# openAI - 테스트에서 실제 호출하지 않는다
openai.api-key=test-openai-key
openai.api-url=http://localhost/openai-test
openai.model=test-model
openai.temperature=0.2

# work24
worknet.base-url=http://localhost
worknet.path=/worknet-test
