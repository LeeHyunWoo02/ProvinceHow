spring.application.name=smash

# Batch Config
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=${BATCH_SCHEMA_INIT:never}
spring.batch.jdbc.schema=classpath:org/springframework/batch/core/schema-mysql.sql

front_url=${FRONT_URL}

# Meta Data
spring.datasource-meta.driver-class-name=${DRIVER}
spring.datasource-meta.jdbc-url=${MYSQL_META_URL}
spring.datasource-meta.username=${MYSQL_META_USERNAME}
spring.datasource-meta.password=${MYSQL_META_PASSWORD}

# Data
spring.datasource-data.driver-class-name=${DRIVER}
spring.datasource-data.jdbc-url=${MYSQL_DATA_URL}
spring.datasource-data.username=${MYSQL_DATA_USERNAME}
spring.datasource-data.password=${MYSQL_DATA_PASSWORD}

spring.jpa.open-in-view=false

server.port=${SERVER_PORT}

# Redis Config
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.repositories.enabled=false

# reverse proxy
server.forward-headers-strategy=framework

# Swagger Configuration
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# publicData Configuration
apis.molit.base-url=${MOLIT_BASE_URL}
apis.molit.path=${MOLIT_PATH}
apis.molit.service-key=${MOLIT_SERVICE_KEY}

# YouthCenter Configuration
apis.youthcenter.base-url=${YOUTH_BASE_URL}
apis.youthcenter.path=${YOUTH_BASE_PATH}
apis.youthcenter.api-key=${YOUTH_API_KEY}

seed.version=${SEED_VERSION}

# Optional override of the dwelling/population base month (yyyyMM). Blank means "current month".
dwelling.dealYmd=${DWELLING_DEAL_YMD_OVERRIDE:}
dwelling.months=${DWELLING_LOOKBACK_MONTHS:12}

# csv filePath
sido.filePath=${SIDO_FILEPATH:data/static/sido.csv}
sigungu.filePath=${SIGUNGU_FILEPATH:data/static/sigungu.csv}
jobCodeTop.filePath=${JOBCODETOP_FILEPATH:data/static/level_top.csv}
jobCodeMiddle.filePath=${JOBCODEMIDDLE_FILEPATH:data/static/level_middle.csv}
jobCount.filePath=${JOBCOUNT_FILEPATH:data/generated/job_count.csv}
population.filePath=${POPULATION_FILEPATH:}
industry.filePath=${INDUSTRY_FILEPATH:}
infra.filePath=${INFRA_FILEPATH:}

# seedMasterJob - the only batch path that runs automatically on startup.
seed.master.enabled=${SEED_MASTER_ENABLED:true}

# Per-step kill switches. A step whose source (file path / API key) is blank is skipped
# with a "missing data" warning, so these stay true and only exist to force a step off.
seed.jobs.sido.enabled=true
seed.jobs.sigungu.enabled=true
seed.jobs.job-code-top.enabled=true
seed.jobs.job-code-middle.enabled=true
seed.jobs.population.enabled=true
seed.jobs.industry.enabled=true
seed.jobs.infra.enabled=true
seed.jobs.job-count.enabled=true
seed.jobs.dwelling.enabled=true

# Scheduled refresh. Disabled until the environment provides the switches.
population.batch.enabled=${POPULATION_BATCH_ENABLED:false}
population.batch.cron=${POPULATION_BATCH_CRON:0 10 4 1 * *}
localdata.batch.enabled=${LOCALDATA_BATCH_ENABLED:false}
localdata.batch.cron=${LOCALDATA_BATCH_CRON:0 20 3 * * *}
dwelling.batch.enabled=${DWELLING_BATCH_ENABLED:false}
dwelling.batch.cron=${DWELLING_BATCH_CRON:0 0 6 5 * *}

# rate limit
ratelimit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS}
ratelimit.allowed-count=${RATE_LIMIT_ALLOWED_COUNT}
ratelimit.lock-ttl-ms=${RATE_LIMIT_LOCK_TTL_MS}
ratelimit.secret=${RATE_LIMIT_SECRET}

# openAI
openai.api-key=${OPENAI_API_KEY}
openai.api-url=${OPENAI_URL}
openai.model=${OPENAI_MODEL}
openai.temperature=${OPENAI_TEMPERATURE}

# 고용24 채용 목록 링크 생성용 (외부 API 아님)
worknet.base-url=${WORKNET_BASE_URL}
worknet.path=${WORKNET_PATH}

# log
logging.level.root=INFO
logging.level.org.apache.coyote.http11.Http11Processor=ERROR
logging.level.org.springframework.security=INFO

# 전월세 기준월 자동 계산 (DWELLING_DEAL_YMD_OVERRIDE 가 비면 자동)
dwelling.confirmedLagMonths=${DWELLING_CONFIRMED_LAG_MONTHS:2}
dwelling.maxFallbackMonths=${DWELLING_MAX_FALLBACK_MONTHS:3}
dwelling.baseMonthProbe.enabled=${DWELLING_BASE_MONTH_PROBE_ENABLED:true}
dwelling.baseMonthProbe.regionCode=${DWELLING_BASE_MONTH_PROBE_REGION:11110}

# 국토부 실거래가 호출 제어 (totalCount 기반 페이지네이션)
apis.molit.page-size=${MOLIT_PAGE_SIZE:1000}
apis.molit.max-pages=${MOLIT_MAX_PAGES:50}
apis.molit.request-interval-ms=${MOLIT_REQUEST_INTERVAL_MS:100}
apis.molit.max-concurrent-requests=${MOLIT_MAX_CONCURRENT_REQUESTS:1}

# 공공데이터포털 공통 인증키 (워크넷/LOCALDATA 가 공유한다)
apis.datagokr.service-key=${DATA_GO_KR_SERVICE_KEY:}

# 워크넷 채용정보 API (일자리 수)
worknet.api.base-url=${WORKNET_API_BASE_URL:https://openapi.work.go.kr}
worknet.api.path=${WORKNET_API_PATH:/opi/opi/opia/wantedApi.do}
worknet.api.max-attempts=${WORKNET_API_MAX_ATTEMPTS:3}
worknet.api.retry-delay-ms=${WORKNET_API_RETRY_DELAY_MS:1000}
worknet.job.batch.enabled=${WORKNET_JOB_BATCH_ENABLED:false}
worknet.job.batch.cron=${WORKNET_JOB_BATCH_CRON:0 0 3 * * *}
worknet.job.page-size=${WORKNET_JOB_PAGE_SIZE:100}
worknet.job.max-pages=${WORKNET_JOB_MAX_PAGES:1000}
worknet.job.dedupe-enabled=${WORKNET_JOB_DEDUPE_ENABLED:true}
worknet.job.reset-missing-to-zero=${WORKNET_JOB_RESET_MISSING_TO_ZERO:true}
worknet.job.spec-path=${WORKNET_JOB_SPEC_PATH:classpath:worknet/worknet-job-api.json}

# KOSIS (population) Configuration
apis.kosis.base-url=${KOSIS_BASE_URL:https://kosis.kr/openapi}
apis.kosis.api-key=${KOSIS_API_KEY:}
apis.kosis.org-id=${KOSIS_ORG_ID:101}
apis.kosis.table-id=${KOSIS_TABLE_ID:DT_1B040A3}
apis.kosis.item-id=${KOSIS_ITEM_ID:T20}
apis.kosis.period-code=${KOSIS_PERIOD_CODE:M}
apis.kosis.json-vd=${KOSIS_JSON_VD:}
apis.kosis.retry-max-attempts=${KOSIS_RETRY_MAX_ATTEMPTS:3}
apis.kosis.retry-backoff-millis=${KOSIS_RETRY_BACKOFF_MILLIS:1000}
apis.kosis.fallback-months=${KOSIS_FALLBACK_MONTHS:3}
