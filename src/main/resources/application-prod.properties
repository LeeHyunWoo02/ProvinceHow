spring.application.name=smash

# Batch Config
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=${BATCH_SCHEMA_INIT:never}
spring.batch.jdbc.schema=classpath:org/springframework/batch/core/schema-mysql.sql

front_url=${FRONT_URL}

# Meta Data
spring.datasource-meta.driver-class-name=${DRIVER}
spring.datasource-meta.jdbc-url=${MYSQL_META_URL}
spring.datasource-meta.username=${MYSQL_META_USERNAME}
spring.datasource-meta.password=${MYSQL_META_PASSWORD}

# Data
spring.datasource-data.driver-class-name=${DRIVER}
spring.datasource-data.jdbc-url=${MYSQL_DATA_URL}
spring.datasource-data.username=${MYSQL_DATA_USERNAME}
spring.datasource-data.password=${MYSQL_DATA_PASSWORD}

spring.jpa.open-in-view=false

server.port=${SERVER_PORT}

# Redis Config
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.repositories.enabled=false

# reverse proxy
server.forward-headers-strategy=framework

# Swagger Configuration
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# publicData Configuration
apis.molit.base-url=${MOLIT_BASE_URL}
apis.molit.path=${MOLIT_PATH}
apis.molit.service-key=${MOLIT_SERVICE_KEY}

# YouthCenter Configuration
apis.youthcenter.base-url=${YOUTH_BASE_URL}
apis.youthcenter.path=${YOUTH_BASE_PATH}
apis.youthcenter.api-key=${YOUTH_API_KEY}
# 수집 신뢰성 설정. 실패한 조합은 저장을 건너뛰어 기존 정책을 보존하므로, 이 값들이
# "얼마나 덜 실패하는가"를 결정한다(값이 나빠도 데이터가 지워지지는 않는다).
# 호출 간 최소 간격(ms). 264 시군구 x 4 태그 = 1,056회를 쉬지 않고 때리면 서버가 403/500 으로 막는다.
# 1,000ms = 초당 1회, 전체 약 18분. LOCALDATA(120ms)/MOLIT(100ms)보다 넉넉하게 잡았다.
apis.youthcenter.request-interval-ms=${YOUTH_REQUEST_INTERVAL_MS:1000}
apis.youthcenter.request-timeout-ms=${YOUTH_REQUEST_TIMEOUT_MS:10000}
# 재시도 총 시도 횟수(1이면 재시도 없음). 429/403/5xx 만 재시도하고 400/401/404 는 즉시 포기한다.
apis.youthcenter.max-attempts=${YOUTH_MAX_ATTEMPTS:3}
# 재시도 지연(ms)과 배수(지수 백오프). 기본값이면 1초 -> 2초, 상한은 max-retry-after-ms 다.
apis.youthcenter.retry-delay-ms=${YOUTH_RETRY_DELAY_MS:1000}
apis.youthcenter.retry-backoff-multiplier=${YOUTH_RETRY_BACKOFF_MULTIPLIER:2}
# 백오프 상한이자 서버가 준 Retry-After 의 상한(ms).
apis.youthcenter.max-retry-after-ms=${YOUTH_MAX_RETRY_AFTER_MS:30000}

# 지원정책 갱신 종료 조건. 먼저 걸리는 쪽이 이번 실행을 끝낸다(실패가 아니라 정상 종료 —
# 저장된 조합은 유지되고 남은 조합은 다음 실행이 이어받는다).
# 연속 실패 임계. 산발적 실패는 5~10% 수준이라 20연속은 사실상 서버 장애일 때만 나온다
# (실패율 10%면 20연속 확률이 1e-20). 0 이하면 연속 실패로 중단하지 않는다.
support.refresh.max-consecutive-failures=${SUPPORT_REFRESH_MAX_CONSECUTIVE_FAILURES:20}
# 데드라인(분). 정상 소요는 1,056회 x 1초 = 약 18분이라 재시도까지 감안해 2.5배를 뒀다.
# 짧게 잡으면 매 실행이 절반만 돌고 끝난다. 0 이하면 데드라인이 없다.
support.refresh.deadline-minutes=${SUPPORT_REFRESH_DEADLINE_MINUTES:45}

seed.version=${SEED_VERSION}

# Optional override of the dwelling/population base month (yyyyMM). Blank means "current month".
dwelling.dealYmd=${DWELLING_DEAL_YMD_OVERRIDE:}
dwelling.months=${DWELLING_LOOKBACK_MONTHS:12}

# csv filePath
sido.filePath=${SIDO_FILEPATH:data/static/sido.csv}
sigungu.filePath=${SIGUNGU_FILEPATH:data/static/sigungu.csv}
jobCodeTop.filePath=${JOBCODETOP_FILEPATH:data/static/level_top.csv}
jobCodeMiddle.filePath=${JOBCODEMIDDLE_FILEPATH:data/static/level_middle.csv}
jobCount.filePath=${JOBCOUNT_FILEPATH:data/generated/job_count.csv}
industry.filePath=${INDUSTRY_FILEPATH:}
infra.filePath=${INFRA_FILEPATH:}

# seedMasterJob - the only batch path that runs automatically on startup.
seed.master.enabled=${SEED_MASTER_ENABLED:true}

# Per-step kill switches. A step whose source (file path / API key) is blank is skipped
# with a "missing data" warning, so these stay true and only exist to force a step off.
seed.jobs.sido.enabled=true
seed.jobs.sigungu.enabled=true
seed.jobs.job-code-top.enabled=true
seed.jobs.job-code-middle.enabled=true
seed.jobs.population.enabled=true
seed.jobs.industry.enabled=true
seed.jobs.infra.enabled=true
seed.jobs.job-count.enabled=true
seed.jobs.dwelling.enabled=true

# Scheduled refresh. Disabled until the environment provides the switches.
population.batch.enabled=${POPULATION_BATCH_ENABLED:false}
population.batch.cron=${POPULATION_BATCH_CRON:0 10 4 1 * *}
localdata.batch.enabled=${LOCALDATA_BATCH_ENABLED:false}
localdata.batch.cron=${LOCALDATA_BATCH_CRON:0 20 3 * * *}
dwelling.batch.enabled=${DWELLING_BATCH_ENABLED:false}
dwelling.batch.cron=${DWELLING_BATCH_CRON:0 0 6 5 * *}

# rate limit
ratelimit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS}
ratelimit.allowed-count=${RATE_LIMIT_ALLOWED_COUNT}
ratelimit.lock-ttl-ms=${RATE_LIMIT_LOCK_TTL_MS}
ratelimit.secret=${RATE_LIMIT_SECRET}

# openAI
openai.api-key=${OPENAI_API_KEY}
openai.api-url=${OPENAI_URL}
openai.model=${OPENAI_MODEL}
openai.temperature=${OPENAI_TEMPERATURE}

# Work24 job-listing link builder (URL assembly only, not an external API call)
worknet.base-url=${WORKNET_BASE_URL}
worknet.path=${WORKNET_PATH}

# log
logging.level.root=INFO
logging.level.org.apache.coyote.http11.Http11Processor=ERROR
logging.level.org.springframework.security=INFO

# Dwelling base-month resolution. Automatic unless DWELLING_DEAL_YMD_OVERRIDE is set.
dwelling.confirmedLagMonths=${DWELLING_CONFIRMED_LAG_MONTHS:2}
dwelling.maxFallbackMonths=${DWELLING_MAX_FALLBACK_MONTHS:3}
dwelling.baseMonthProbe.enabled=${DWELLING_BASE_MONTH_PROBE_ENABLED:true}
dwelling.baseMonthProbe.regionCode=${DWELLING_BASE_MONTH_PROBE_REGION:11110}

# MOLIT real-transaction API call control (totalCount-driven pagination)
apis.molit.page-size=${MOLIT_PAGE_SIZE:1000}
apis.molit.max-pages=${MOLIT_MAX_PAGES:50}
apis.molit.request-interval-ms=${MOLIT_REQUEST_INTERVAL_MS:100}
apis.molit.max-concurrent-requests=${MOLIT_MAX_CONCURRENT_REQUESTS:1}

# Shared data.go.kr service key (used by both Worknet and LOCALDATA)
apis.datagokr.service-key=${DATA_GO_KR_SERVICE_KEY:}

# Job-posting provider switch. Selects which JobPostingProvider / JobListingLinkProvider
# implementation is active. Default = saramin. Set to 'worknet' to fall back to the legacy adapter.
apis.job.provider=${JOB_PROVIDER:saramin}

# Saramin job-posting API (job counts) - the active source.
#   Endpoint: GET https://oapi.saramin.co.kr/job-search (JSON). Auth: access-key query param.
#   Paging: start(0-based) + count(<=110). Response jobs.total is a string.
#   WARNING: Saramin open API allows at most 500 calls/day - the batch must stay within it.
apis.saramin.access-key=${SARAMIN_ACCESS_KEY:}
apis.saramin.base-url=${SARAMIN_BASE_URL:https://oapi.saramin.co.kr}
apis.saramin.path=${SARAMIN_PATH:/job-search}
apis.saramin.max-attempts=${SARAMIN_MAX_ATTEMPTS:3}
apis.saramin.retry-delay-ms=${SARAMIN_RETRY_DELAY_MS:1000}
apis.saramin.spec-path=${SARAMIN_SPEC_PATH:classpath:saramin/saramin-job-api.json}
# Individual job-vacancy cards shown on region detail. Keep small - Saramin allows 500 calls/day.
apis.saramin.vacancy.list-size=${SARAMIN_VACANCY_LIST_SIZE:5}
# Region job profile (salary median / newcomer ratio / top industries). One call per region (<=110).
apis.saramin.profile.sample-size=${SARAMIN_PROFILE_SAMPLE_SIZE:100}
apis.saramin.profile.top-industries=${SARAMIN_PROFILE_TOP_INDUSTRIES:5}
# Cache hardening (ISO-8601 durations). negative-ttl: short TTL for cached 0-result to save 500 calls/day.
# lock-timeout: single-flight wait before degrading to empty on cold-cache stampede.
apis.saramin.vacancy.negative-ttl=${SARAMIN_VACANCY_NEGATIVE_TTL:PT30M}
apis.saramin.profile.negative-ttl=${SARAMIN_PROFILE_NEGATIVE_TTL:PT30M}
apis.saramin.cache.lock-timeout=${SARAMIN_CACHE_LOCK_TIMEOUT:PT3S}
# JobCount batch call-budget guardrail. Page fetch == 1 API call; Saramin allows 500 calls/day SHARED
# with the on-demand vacancy/profile features. This caps batch page fetches so it cannot exhaust the
# daily budget and block user queries. Effective cap = min(worknet.job.max-pages, this). If the cap is
# hit before the full crawl completes, the run is abandoned (no rows written, no count=0 reset) to keep
# existing data safe from partial-snapshot corruption. Conservative default; TUNE after access-key issue
# and confirm the batch-vs-on-demand split (sign-off item, see docs/batch-data-pipeline.md).
apis.saramin.batch.max-api-calls=${SARAMIN_BATCH_MAX_API_CALLS:400}
# Saramin job-listing link builder (URL assembly only, not an external API call).
#   NOTE: our SigunguCode/JobCode are passed as loc_cd/job_cd as-is; until a reverse
#   mapping (our code -> saramin code) is built the link will not filter precisely on saramin.
saramin.listing.base-url=${SARAMIN_LISTING_BASE_URL:https://www.saramin.co.kr}
saramin.listing.path=${SARAMIN_LISTING_PATH:/zf_user/jobs/list/domestic}

# Worknet job-posting API (job counts) - LEGACY, inactive by default (apis.job.provider=worknet enables it).
worknet.api.base-url=${WORKNET_API_BASE_URL:https://openapi.work.go.kr}
worknet.api.path=${WORKNET_API_PATH:/opi/opi/opia/wantedApi.do}
worknet.api.max-attempts=${WORKNET_API_MAX_ATTEMPTS:3}
worknet.api.retry-delay-ms=${WORKNET_API_RETRY_DELAY_MS:1000}
# Job-count batch source: true = external API (provider chosen by apis.job.provider), false = legacy CSV.
# Also drives DataRefreshScheduler's job-count cron. Provider-neutral despite the "worknet" prefix.
worknet.job.batch.enabled=${WORKNET_JOB_BATCH_ENABLED:false}
worknet.job.batch.cron=${WORKNET_JOB_BATCH_CRON:0 0 3 * * *}
worknet.job.page-size=${WORKNET_JOB_PAGE_SIZE:100}
worknet.job.max-pages=${WORKNET_JOB_MAX_PAGES:1000}
worknet.job.dedupe-enabled=${WORKNET_JOB_DEDUPE_ENABLED:true}
worknet.job.reset-missing-to-zero=${WORKNET_JOB_RESET_MISSING_TO_ZERO:true}
worknet.job.spec-path=${WORKNET_JOB_SPEC_PATH:classpath:worknet/worknet-job-api.json}

# KOSIS (population) Configuration
apis.kosis.base-url=${KOSIS_BASE_URL:https://kosis.kr/openapi}
apis.kosis.api-key=${KOSIS_API_KEY:}
apis.kosis.org-id=${KOSIS_ORG_ID:101}
apis.kosis.table-id=${KOSIS_TABLE_ID:DT_1B040A3}
apis.kosis.item-id=${KOSIS_ITEM_ID:T20}
apis.kosis.period-code=${KOSIS_PERIOD_CODE:M}
apis.kosis.json-vd=${KOSIS_JSON_VD:}
apis.kosis.retry-max-attempts=${KOSIS_RETRY_MAX_ATTEMPTS:3}
apis.kosis.retry-backoff-millis=${KOSIS_RETRY_BACKOFF_MILLIS:1000}
apis.kosis.fallback-months=${KOSIS_FALLBACK_MONTHS:3}

# LOCALDATA (industry / infra) Configuration
apis.localdata.base-url=${LOCALDATA_API_BASE_URL:https://apis.data.go.kr}
apis.localdata.daily-call-budget=${LOCALDATA_DAILY_CALL_BUDGET:9000}
# LOCALDATA 전용 RestTemplate 타임아웃(공유 빈과 별개다). 읽기 타임아웃이 짧으면 수집 전량이 폐기된다.
apis.localdata.connect-timeout-ms=${LOCALDATA_CONNECT_TIMEOUT_MS:5000}
apis.localdata.read-timeout-ms=${LOCALDATA_READ_TIMEOUT_MS:60000}
# 재시도 지연 배수(지수 백오프). 1초 → 2초 → 4초, 상한은 max-retry-after-ms 다.
apis.localdata.retry-backoff-multiplier=${LOCALDATA_RETRY_BACKOFF_MULTIPLIER:2}
infra.collect.source=${INFRA_COLLECT_SOURCE:API}
# 회차가 이 일수를 넘도록 완성되지 않으면 log.error 로 stall 을 알린다(관측 전용, 배치는 죽지 않는다).
infra.collect.stall-threshold-days=${INFRA_COLLECT_STALL_THRESHOLD_DAYS:7}
infra.ratio.basis=${INFRA_RATIO_BASIS:PERCENT}
infra.industry-master.location=${INFRA_INDUSTRY_MASTER:classpath:infra/industry-master.yml}
infra.region-mapping.location=${INFRA_REGION_MAPPING:classpath:infra/localdata-region-mapping.yml}
