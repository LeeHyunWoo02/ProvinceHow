# ============================================================================
#  개방자치단체코드(7자리) → 표준 시군구코드(5자리) 매핑
# ============================================================================
#  ⚠️ 이 파일은 "수집 대상 목록"이기도 하다. 여기 없는 자치단체는 수집하지 않고,
#     여기 없는 개방자치단체코드로 들어온 사업장은 임의 추정 없이 제외된다.
#
#  위치는 프로퍼티로 바꿀 수 있다.
#    infra.region-mapping.location=classpath:infra/localdata-region-mapping.yml  (기본)
#    infra.region-mapping.location=file:/etc/smash/localdata-region-mapping.yml  (운영 교체)
#
# ---------------------------------------------------------------------------
#  왜 매핑 파일인가
#    개방자치단체코드(신 API `OPN_ATMY_GRP_CD`, 구 `opnSfTeamCode`)는 인허가기관의
#    7자리 독자 코드이고 법정동/행정표준코드와 산술 관계가 없다.
#      서울종로구 3000000 = 11110 / 경기수원시 3740000 = 41110
#    응답에 법정동코드 필드도 없다. 따라서 변환식이 아니라 표가 필요하다.
#
#  ⚠️⚠️ 이 파일은 미완성이다 ⚠️⚠️
#    공식 코드표는 data.go.kr 참고문서 `개방자치단체코드_영업상태코드.xlsx`
#    시트 `1. 개방자치단체코드` 이며 총 261행이다(시도 전체 17 + 시도 본청 16 + 시군구 228).
#    작성 시점에 이 개발 환경에서 data.go.kr 로 나가는 네트워크가 막혀 있어
#    전수를 내려받지 못했다. 아래에는 문서에서 확인된 6건만 들어 있다.
#
#    채우는 방법 (docs/localdata-infra.md 참고)
#      1) 아래 URL 로 xlsx 를 받는다
#         https://www.data.go.kr/cmm/cmm/fileDownload.do?atchFileId=FILE_000000003594039&fileDetailSn=1
#      2) 시트 `1. 개방자치단체코드` 의 시군구 228행을 뽑는다
#      3) data/static/sigungu.csv(264행)와 `시도 2자 약칭 + 시군구명(공백 제거)` 규칙으로 조인한다
#         → 228건 전부 매칭된다(문서 실측)
#      4) 아래 형식으로 붙여 넣는다
#
#  매칭되지 않는 프로젝트 쪽 36행 = 일반구 35개 + 세종 1개.
#    인허가 권한이 일반구가 아니라 시에 있어 데이터가 시 단위로만 나온다.
#    (수원시 장안/권선/팔달/영통구, 성남시 수정/중원/분당구, 안양시 만안/동안구,
#     부천시 원미/소사/오정구, 안산시 상록/단원구, 고양시 덕양/일산동/일산서구,
#     용인시 처인/기흥/수지구, 청주시 상당/서원/흥덕/청원구, 천안시 동남/서북구,
#     포항시 남/북구, 창원시 의창/성산/마산합포/마산회원/진해구, 전주시 완산/덕진구)
#    세종특별자치시는 시군구 목록이 아니라 시도 본청 코드 5690000 을 쓴다.
#
#    ⚠️ 일반구 35개를 상위 시의 값으로 채울지, 주소 문자열로 재분배할지는 정책 결정이라
#       여기서 정하지 않았다. 현재 구현은 "매핑에 있는 것만" 적재한다 —
#       일반구는 infra 행이 없고, 그 지역의 인프라 점수는 결측이 된다.
#       (결측 대분류는 InfraScorePolicy 에서 0점으로 합산돼 추천 점수를 낮춘다.)
# ---------------------------------------------------------------------------
#  형식
#    openOrgCode : 개방자치단체코드(7자리, `_ALL` 접미 허용)
#    sigunguCode : 표준 시군구코드(5자리)
#    name        : 자치단체명(검토용)
# ============================================================================

regions:
  - openOrgCode: "3000000"
    sigunguCode: "11110"
    name: 서울종로구
  - openOrgCode: "3010000"
    sigunguCode: "11140"
    name: 서울중구
  - openOrgCode: "3220000"
    sigunguCode: "11680"
    name: 서울강남구
  - openOrgCode: "4181000"
    sigunguCode: "51110"
    name: 강원춘천시
  - openOrgCode: "3740000"
    sigunguCode: "41110"
    name: 경기수원시
  - openOrgCode: "3780000"
    sigunguCode: "41130"
    name: 경기성남시
