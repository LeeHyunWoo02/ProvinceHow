# ============================================================================
#  개방자치단체코드(7자리) → 표준 시군구코드(5자리) 매핑
# ============================================================================
#  ⚠️ 이 파일은 "수집 대상 목록"이기도 하다. 여기 없는 자치단체는 수집하지 않고,
#     여기 없는 개방자치단체코드로 들어온 사업장은 임의 추정 없이 제외된다.
#
#  위치는 프로퍼티로 바꿀 수 있다.
#    infra.region-mapping.location=classpath:infra/localdata-region-mapping.yml  (기본)
#    infra.region-mapping.location=file:/etc/smash/localdata-region-mapping.yml  (운영 교체)
#
# ---------------------------------------------------------------------------
#  왜 매핑 파일인가
#    개방자치단체코드(신 API `OPN_ATMY_GRP_CD`, 구 `opnSfTeamCode`)는 인허가기관의
#    7자리 독자 코드이고 법정동/행정표준코드와 산술 관계가 없다.
#      서울종로구 3000000 = 11110 / 경기수원시 3740000 = 41110
#    응답에 법정동코드 필드도 없다. 따라서 변환식이 아니라 표가 필요하다.
#
#  출처와 채운 방법
#    공식 참고문서 `개방자치단체코드_영업상태코드.xlsx` 시트 `1. 개방자치단체코드`(총 261행)를
#    data.go.kr 에서 내려받아 파싱했다. 확인일 2026-08-13.
#      https://www.data.go.kr/cmm/cmm/fileDownload.do?atchFileId=FILE_000000003594039&fileDetailSn=1
#    261행 = 시도 전체 17(_ALL) + 시도 본청 16 + 시군구 228.
#    시군구 228행을 data/static/sigungu.csv 와 `시도 2자 약칭 + 시군구명(공백 제거)` 규칙으로
#    조인해 228건 전부 매칭했다. 여기에 세종 1건을 더해 229건이다.
#
#  세종특별자치시(36110)
#    시군구 목록이 아니라 시도 본청 코드 5690000 을 쓴다. 하위 시군구가 없어 본청이 곧 시군구다.
#
#  일반구 39개 (수원·성남·안양·부천·안산·고양·용인·화성·청주·천안·포항·창원·전주)
#    LOCALDATA 는 인허가 권한이 있는 시 단위로만 자료를 준다. 그래서 상위 시 코드 하나가
#    여러 시군구코드에 대응한다. 아래 districtSplits 가 그 분해 규칙이고,
#    사업장 주소 문자열의 구 이름으로 재분배한다(정책 결정 2026-08-13).
#    구 이름을 못 찾은 사업장은 임의 배분하지 않고 매핑 실패로 집계한다.
#
#  화성시(41590 → 41591/41593/41595/41597) 2026-08-28 추가
#    주소에 구 이름이 있어야 갈린다. 개편 전 표기(`화성시 반송동 …`)로 남은 사업장은
#    다른 일반구와 마찬가지로 매핑 실패로 집계된다 — 임의 배분하지 않는다.
#
#  인천 행정구역 개편 — 신규 4개 코드는 아직 매핑하지 않았다 [미확인]
#    28125 제물포구 / 28155 영종구 / 28275 서구 / 28290 검단구 가 MOLIT 실거래에는 있으나,
#    LOCALDATA 쪽 개방자치단체코드가 바뀌었는지 실측하지 못했다. 추측 매핑을 만들지 않는다.
#    그래서 인천 인프라는 옛 코드(3490000→28110 / 3500000→28140 / 3560000→28260)에 계속 쌓이고
#    신규 4구는 인프라가 비어 있다. districtSplits 로도 나눌 수 없다 — 개편 전 주소에는
#    `검단구`·`영종구` 같은 구 이름이 아예 없고, 제물포구는 두 코드를 하나로 합치는 반대 방향이다.
# ---------------------------------------------------------------------------
#  형식
#    openOrgCode : 개방자치단체코드(7자리, `_ALL` 접미 허용)
#    sigunguCode : 표준 시군구코드(5자리)
#    name        : 자치단체명(검토용)
# ============================================================================

