# ============================================================================
#  업종 마스터 (infra 컨텍스트 정본)
# ============================================================================
#  이 파일이 `industry` 테이블과 인프라 수집 대상의 정본이다.
#  industryJob 이 이 파일을 읽어 industry 테이블을 채우고,
#  infraJob 이 같은 파일의 slug 로 인허가 데이터를 수집한다.
#
#  위치는 프로퍼티로 바꿀 수 있다.
#    infra.industry-master.location=classpath:infra/industry-master.yml   (기본)
#    infra.industry-master.location=file:/etc/smash/industry-master.yml   (운영 교체)
#
# ---------------------------------------------------------------------------
#  ⚠️ major(대분류) 배정은 서비스 기획 판단이다. 코드가 추론하지 않는다.
#     아래 값은 전부 "제안"이다. majorReviewed: false 인 항목은 기동/배치 로그에
#     "확인 필요"로 계속 남는다. 사람이 확인하면 majorReviewed: true 로 바꿔라.
#     major: null 인 항목은 미확정이므로 적재도 수집도 되지 않는다.
#
#     major 후보: HEALTH(보건·의료) / FOOD(음식) / CULTURE(문화·여가) / LIFE(생활편의)
#     major: null → 미확정. enabled 와 무관하게 적재되지 않는다.
# ---------------------------------------------------------------------------
#  필드
#    industryCode  : 내부 업종 코드. industry.industry_code(varchar 10)에 그대로 들어간다
#    name          : 표시 이름
#    major         : 인프라 대분류
#    slug          : data.go.kr 엔드포인트 slug
#                    https://apis.data.go.kr/1741000/{slug}/info
#                    https://file.localdata.go.kr/file/download/{slug}/info?orgCode=...
#    datasetId     : data.go.kr 데이터셋 ID. 활용신청 화면을 찾는 용도(호출에는 쓰지 않는다)
#    enabled       : 수집·적재 대상 여부
#    majorReviewed : major 배정을 사람이 확인했는가
#    note          : 운영 메모
#
#  ⚠️ 인증키는 계정당 하나(DATA_GO_KR_SERVICE_KEY)지만 권한은 데이터셋 단위다.
#     새 업종을 켜기 전에 data.go.kr 에서 해당 데이터셋 활용신청을 눌러야 한다(자동승인).
# ============================================================================

industries:

