# 대시보드 프로비저닝. docker/grafana/dashboards/*.json 을 읽어 등록한다.
apiVersion: 1

providers:
  - name: smash
    orgId: 1
    folder: smash
    type: file
    # true 로 두면 UI 에서 지운 대시보드가 다시 살아나지 않는다. 파일이 정본이므로 false.
    disableDeletion: false
    # UI 에서 고친 내용을 파일이 덮어쓴다. 대시보드의 정본은 레포다.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
